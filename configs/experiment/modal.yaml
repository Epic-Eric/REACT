# Modal cloud training configuration (GPU on full dataset)

# Training parameters
training:
  num_epochs: 10
  batch_size: 32
  gradient_clip_norm: 1.0
  num_workers: 4
  
  # Optimizer
  optimizer:
    name: adamw
    lr: 1e-4
    weight_decay: 1e-4
    betas: [0.9, 0.999]
    eps: 1e-8
  
  # Scheduler
  scheduler:
    name: cosine
    min_lr: 1e-7
  
  # Checkpointing
  checkpoint:
    save_every: 10
    save_best: true

# Device settings
device: cuda

# Model configuration
model:
  feature_dim: 64
  user_embedding_dim: 128
  freeze_encoder: true
  pretrained_checkpoint: emg2pose_model_checkpoints/regression_vemg2pose.ckpt

# Data configuration  
data:
  # Full dataset (downloaded to Modal volume)
  data_dir: /root/emg2pose_dataset
  window_length: 10000
  stride: 2000
  
  # Calibration - larger range for full training
  calibration:
    k_min: 0
    k_max: 30
  
  # Session limits (null = use all)
  train_sessions_limit: null
  val_sessions_limit: null

# Modal-specific settings
modal:
  gpu: A10G  # T4, A10G, or A100
  timeout_hours: 12
  memory_mb: 32768
  volume_name: emg2pose-full-dataset

# Output settings
output:
  dir: /persistent/react_outputs
  save_predictions: false
  commit_every: 10  # Commit volume every N epochs

# Reproducibility
seed: 42
