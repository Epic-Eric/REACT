# Modal cloud training - REGRESSION mode
# Aligned with emg2pose/config/experiment/regression_vemg2pose.yaml
#
# Uses pretrained vemg2pose encoder (regression mode)
# - No initial position provided
# - No gradient clipping (consistent with emg2pose regression)
# - Predicts joint angles directly from EMG

# Training parameters (aligned with emg2pose base.yaml)
training:
  num_epochs: 2  # Phase 1: frozen encoder, train FiLM layers
  num_epochs_enc_unfreeze: 2  # Phase 2: set >0 to gradually unfreeze encoder
  batch_size: 128   # 2x emg2pose default
  gradient_clip_norm: 0.0  # No clipping for regression (emg2pose: gradient_clip_val: 0)
  num_workers: 16
  warmup_steps: 500  # Linear LR warmup for training stability
  
  # Optimizer (emg2pose uses Adam with lr=0.001)
  optimizer:
    name: adamw
    lr: 1e-3  # emg2pose regression lr
    weight_decay: 1e-4
    betas: [0.9, 0.999]
    eps: 1e-8
  
  # Scheduler (Phase 1 only; Phase 2 uses layerwise LR decay)
  scheduler:
    name: cosine
    min_lr: 1e-7
  
  # Encoder unfreezing (Phase 2) — inactive when num_epochs_enc_unfreeze=0
  encoder_unfreeze:
    base_lr: 1e-4
    lr_decay: 0.5
  
  # Early stopping (emg2pose: patience=50)
  early_stopping:
    patience: 50
    monitor: val_loss
    mode: min
  
  # Checkpointing
  checkpoint:
    save_every: 1
    save_best: true

# Device settings
device: cuda

# Model configuration
model:
  feature_dim: 64  # TDS output channels
  user_embedding_dim: 128
  freeze_encoder: true
  # Use REGRESSION checkpoint (vemg2pose)
  pretrained_checkpoint: emg2pose_model_checkpoints/regression_vemg2pose.ckpt
  
  # Regression-specific settings
  provide_initial_pos: false
  state_condition: true

# Data configuration (aligned with emg2pose)
data:
  # Full dataset location on Modal volume
  # Note: Volume contents appear directly at mount point, not under volume name
  data_dir: /persistent/emg2pose_data
  # emg2pose uses 11790 = 10000 + 1790 (TDS left_context)
  window_length: 11790
  val_test_window_length: 11790
  stride: 2000
  
  # Calibration - larger range for full training
  calibration:
    k_min: 0
    k_max: 30
  
  # Session limits (null = use all)
  train_sessions_limit: null
  val_sessions_limit: null

# Loss weights (aligned with emg2pose)
loss_weights:
  mae: 1.0
  fingertip_distance: 0.01

# Modal-specific settings
modal:
  gpu: H100
  timeout_hours: 24
  memory_mb: 262144 # 256GB RAM
  volume_name: emg2pose-full-dataset

# Output settings
output:
  dir: /persistent/react_outputs
  save_predictions: true
  commit_every: 1

# Reproducibility (emg2pose default)
seed: 42
