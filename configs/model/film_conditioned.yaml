# Model configuration for FiLM-conditioned hybrid model
# Main model combining frozen encoder + user encoder + FiLM + prediction head

# Feature dimension from pretrained encoder
feature_dim: 64

# User embedding dimension
user_embedding_dim: 128

# Number of output joints (DOF)
num_joints: 20

# User encoder configuration
user_encoder:
  # Temporal pooling method: "attention" or "gru"
  pooling_method: "gru"

  # Characteristic CNN config
  characteristic_cnn:
    input_dim: 64
    hidden_dim: 64
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
  
  # Attention scorer config (used when pooling_method: "attention")
  attention_scorer:
    input_dim: 64
    hidden_dim: 32
    num_heads: 4
    dropout: 0.1
    temperature: 1.0
  
  # GRU pooling config (used when pooling_method: "gru")
  gru_pooling:
    in_channels: 64
    hidden_size: 64
    num_layers: 3
    bidirectional: true
    dropout: 0.1
  
  # Transformer group encoder config
  group_encoder:
    input_dim: 64
    hidden_dim: 128
    output_dim: 128
    num_layers: 3
    num_heads: 4
    dropout: 0.1
    max_samples: 30

# FiLM layer config
film_layer:
  conditioning_dim: 128  # user_embedding_dim
  feature_dim: 64
  hidden_dim: 128
  num_layers: 2
  dropout: 0.1
  use_layer_norm: true

# Prediction head config
prediction_head:
  input_dim: 64  # feature_dim
  hidden_dim: 128
  output_dim: 20  # num_joints
  num_layers: 3
  dropout: 0.1
  use_batch_norm: true
  temporal: false  # true for conv-based, false for MLP

# Pretrained encoder path (set at runtime)
pretrained_encoder_path: null
freeze_encoder: true
